<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2f7fb"><title>Refresh BART Party</title><style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#f2f7fb;color:#002d50;max-width:420px;margin:15vh auto;padding:24px;line-height:1.6}a{color:#14749e}button{font:inherit;padding:14px;background:#002d50;color:white;border:0;border-radius:8px}h1{line-height:1.2}</style></head><body><h1>Refresh BART Party</h1><p id="status" role="status">Loading the latest soundboard…</p><p>Your personal recordings will stay on this device.</p><button id="retry" hidden>Try again</button><script>
async function refreshApp() {
  const status = document.querySelector('#status');
  document.querySelector('#retry').hidden = true;
  try {
    // Confirm the site is reachable before removing its old offline copy.
    const response = await fetch('/sounds.json?refresh=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) throw new Error('Unable to reach the app');
    const sounds = await response.json();
    if (!Array.isArray(sounds) || !sounds.length) throw new Error('Invalid sound list');
    const registration = await navigator.serviceWorker?.getRegistration('/');
    if (registration) await registration.unregister();
    for (const key of await caches.keys()) if (key.startsWith('bart-party-')) await caches.delete(key);
    location.replace('/?refreshed=' + Date.now());
  } catch {
    status.textContent = 'Connect to the internet, then try again.';
    document.querySelector('#retry').hidden = false;
  }
}
document.querySelector('#retry').addEventListener('click', refreshApp);
refreshApp();
</script></body></html>
